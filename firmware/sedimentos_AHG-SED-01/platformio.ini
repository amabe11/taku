; PlatformIO · ESP32 DevKit (ESP-WROOM-32) + TCS34725
; Abrir esta carpeta en VS Code con la extensión PlatformIO:
;   Compilar: ✓ (Build) · Cargar: → (Upload) · Monitor Serie: 🔌 (Monitor, 115200)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit TCS34725
